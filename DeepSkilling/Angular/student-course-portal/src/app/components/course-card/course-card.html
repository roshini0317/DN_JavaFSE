
<div
  class="course-card"
  appHighlight="lightblue"
  [ngClass]="cardClasses"
  [ngStyle]="{
    'border-left-color': borderColor
  }">

  <h3>{{ course.name }}</h3>

  <p>
    <strong>Course ID:</strong>
    {{ course.id }}
  </p>

  <p>
    <strong>Course Code:</strong>
    {{ course.code }}
  </p>

  <p>
    <strong>Credits:</strong>
    {{ course.credits }}
  </p>

  <div [ngSwitch]="course.gradeStatus">

    <span
      *ngSwitchCase="'passed'"
      class="status-badge passed">

      Passed

    </span>

    <span
      *ngSwitchCase="'failed'"
      class="status-badge failed">

      Failed

    </span>

    <span
      *ngSwitchDefault
      class="status-badge pending">

      Pending

    </span>

  </div>

  <button
  class="enroll-btn"
  (click)="requestEnrollment($event)">

  {{
    isEnrolled
      ? 'Unenroll'
      : 'Enroll'
  }}

</button>
  <button
  class="details-btn"
  (click)="toggleDetails()">

  {{ isExpanded ? 'Hide Details' : 'Show Details' }}

</button>
<div
  *ngIf="isExpanded"
  class="course-details">

  <p>
    Course Code: {{ course.code }}
  </p>

  <p>
  <strong>Credits:</strong>
  {{ course.credits | creditLabel }}
</p>

</div>

</div>
