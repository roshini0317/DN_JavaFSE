<section class="course-list-container">

  <h2>Available Courses</h2>
  <div class="search-box">

  <input
  type="text"
  [(ngModel)]="searchTerm"
  (input)="updateSearch()"
  placeholder="Search courses">

  <button
    type="button"
    (click)="onSearch()">

    Search

  </button>

</div>

  <p *ngIf="isLoading">
    Loading courses...
  </p>

  <ng-container *ngIf="!isLoading">

    <ng-container *ngIf="courses.length > 0; else noCourses">
<div
        *ngFor="
          let course of filteredCourses;
          let i = index;
          trackBy: trackByCourseId
        "
        class="course-wrapper"
        (click)="navigateToCourse(course.id)">

        <app-course-card
          [course]="course"
          (enrollRequested)="onEnroll($event)">
        </app-course-card>

      </div>

      <p *ngIf="selectedCourseId !== null">

        Selected Course ID:
        <strong>{{ selectedCourseId }}</strong>

      </p>

    </ng-container>

  </ng-container>

  <ng-template #noCourses>

    <p>
      No courses available.
    </p>

  </ng-template>

</section>
