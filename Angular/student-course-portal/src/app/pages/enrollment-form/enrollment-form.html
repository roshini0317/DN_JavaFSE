<section class="enrollment-container">

  <h2>Student Enrollment Request</h2>

  <form
    #enrollForm="ngForm"
    (ngSubmit)="onSubmit(enrollForm)">

    <!-- Student Name -->

    <div class="form-group">

      <label for="studentName">
        Student Name
      </label>

      <input
        id="studentName"
        type="text"
        name="studentName"
        [(ngModel)]="studentName"
        required
        minlength="3"
        #nameCtrl="ngModel">

      <span
        class="error"
        *ngIf="
          nameCtrl.touched &&
          nameCtrl.errors?.['required']
        ">

        Name is required

      </span>

      <span
        class="error"
        *ngIf="
          nameCtrl.touched &&
          nameCtrl.errors?.['minlength']
        ">

        Name must be at least 3 characters

      </span>

    </div>

    <!-- Student Email -->

    <div class="form-group">

      <label for="studentEmail">
        Student Email
      </label>

      <input
        id="studentEmail"
        type="email"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        required
        email
        #emailCtrl="ngModel">

      <span
        class="error"
        *ngIf="
          emailCtrl.touched &&
          emailCtrl.errors?.['required']
        ">

        Email is required

      </span>

      <span
        class="error"
        *ngIf="
          emailCtrl.touched &&
          emailCtrl.errors?.['email']
        ">

        Enter a valid email address

      </span>

    </div>

    <!-- Course ID -->

    <div class="form-group">

      <label for="courseId">
        Course ID
      </label>

      <input
        id="courseId"
        type="number"
        name="courseId"
        [(ngModel)]="courseId"
        required
        #courseCtrl="ngModel">

      <span
        class="error"
        *ngIf="
          courseCtrl.touched &&
          courseCtrl.errors?.['required']
        ">

        Course ID is required

      </span>

    </div>

    <!-- Preferred Semester -->

    <div class="form-group">

      <label for="semester">
        Preferred Semester
      </label>

      <select
        id="semester"
        name="preferredSemester"
        [(ngModel)]="preferredSemester"
        required
        #semesterCtrl="ngModel">

        <option value="">
          Select Semester
        </option>

        <option value="Odd">
          Odd
        </option>

        <option value="Even">
          Even
        </option>

      </select>

      <span
        class="error"
        *ngIf="
          semesterCtrl.touched &&
          semesterCtrl.errors?.['required']
        ">

        Please select a semester

      </span>

    </div>

    <!-- Terms and Conditions -->

    <div class="checkbox-group">

      <input
        id="terms"
        type="checkbox"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        required
        #termsCtrl="ngModel">

      <label for="terms">
        I agree to the Terms and Conditions
      </label>

    </div>

    <span
      class="error"
      *ngIf="
        termsCtrl.touched &&
        termsCtrl.invalid
      ">

      You must accept the terms and conditions

    </span>

    <!-- Form Status -->

    <div class="form-status">

      <p>
        Form Valid:
        <strong>{{ enrollForm.valid }}</strong>
      </p>

    </div>

    <!-- Buttons -->

    <div class="button-group">

      <button
        type="submit"
        [disabled]="enrollForm.invalid">

        Submit Request

      </button>

      <button
        type="button"
        (click)="enrollForm.resetForm(); submitted = false">

        Reset Form

      </button>

    </div>

  </form>

  <!-- Success Message -->

  <div
    class="success-message"
    *ngIf="submitted">

    Enrollment request submitted successfully!

  </div>

</section>
